
databases:
  - name: agfintax-db
    plan: free
    databaseName: agfintax
    user: agfintax

services:
  - type: web
    name: agfintax-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r requirements-postgres.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: agfintax-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false   # optional -- only needed if LLM_PROVIDER=anthropic
      - key: OPENAI_API_KEY
        sync: false   # set this in the Render dashboard; leave blank to run in deterministic-fallback mode
      - key: DAILY_MESSAGE_LIMIT_DEFAULT
        value: "50"

  - type: web
    name: agfintax-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://agfintax-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
